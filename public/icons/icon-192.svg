<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Maskable safe zone: artwork stays within 80% (inner 153x153) -->
  <!-- Background — deep navy -->
  <rect width="192" height="192" rx="38" fill="#1a1a2e"/>
  <!-- Subtle honeycomb hex ring -->
  <polygon points="96,22 138,46 138,94 96,118 54,94 54,46" fill="#fbbf24" opacity="0.10"/>
  <polygon points="96,30 130,50 130,90 96,110 62,90 62,50" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.25"/>
  <!-- Wings -->
  <ellipse cx="58" cy="80" rx="22" ry="14" fill="#bae6fd" opacity="0.80" transform="rotate(-25,58,80)"/>
  <ellipse cx="134" cy="80" rx="22" ry="14" fill="#bae6fd" opacity="0.80" transform="rotate(25,134,80)"/>
  <!-- Bee body -->
  <ellipse cx="96" cy="115" rx="28" ry="36" fill="#fbbf24"/>
  <!-- Stripes -->
  <rect x="68" y="107" width="56" height="10" rx="5" fill="#1a1a2e" opacity="0.45"/>
  <rect x="68" y="121" width="56" height="10" rx="5" fill="#1a1a2e" opacity="0.45"/>
  <!-- Stinger -->
  <polygon points="96,151 88,164 104,164" fill="#d97706"/>
  <!-- Head -->
  <circle cx="96" cy="70" r="22" fill="#fbbf24"/>
  <!-- Eyes -->
  <circle cx="88" cy="67" r="4.5" fill="#1a1a2e"/>
  <circle cx="104" cy="67" r="4.5" fill="#1a1a2e"/>
  <circle cx="89.5" cy="65.5" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="105.5" cy="65.5" r="1.5" fill="white" opacity="0.6"/>
  <!-- Smile -->
  <path d="M 88 77 Q 96 83 104 77" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <!-- Antennae -->
  <line x1="90" y1="49" x2="78" y2="33" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <circle cx="77" cy="32" r="5" fill="#fbbf24"/>
  <line x1="102" y1="49" x2="114" y2="33" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <circle cx="115" cy="32" r="5" fill="#fbbf24"/>
</svg>
